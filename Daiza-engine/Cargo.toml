[package]
name = "daiza-engine"
version = "0.1.0"
edition = "2021"
description = "Pure-CPU, zero-dependency inference engine for 1-bit Bonsai 27B"
license = "Apache-2.0"

[lib]
name = "daiza_engine"
path = "src/lib.rs"

[[bin]]
name = "daiza-cli"
path = "src/main.rs"

[profile.release]
# 推理引擎是带宽/计算密集型,release 优化档对最终 tok/s 至关重要
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1   # 开发时也启用 O1,避免 GEMM 慢到无法验证

[dependencies]
# 零外部依赖。所有功能(含 FP16/BF16、BPE、GEMM、SSM)从零实现。
# 设计依据见 README.md 与 Bonsai-27B-gguf/ 白皮书。
