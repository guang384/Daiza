[package]
name = "daiza-engine"
version = "0.1.0"
edition = "2021"
description = "Pure-CPU Rust inference engine core for 1-bit Bonsai 27B"
license = "Apache-2.0"

[lib]
name = "daiza_engine"
path = "src/lib.rs"

[dependencies]
# 跨平台 mmap: 用于 GGUF 权重文件按需 page-in, 避免一次性 read_to_end 导致 ~3.9GB 内存峰值。
memmap2 = "0.9"
# 图像解码 (PNG/JPEG) + resize: 多模态图像预处理
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 零拷贝字节转换 (f32/u32 slice ↔ u8 slice), 用于 cache state 序列化
bytemuck = { version = "1.21", features = ["derive"] }
