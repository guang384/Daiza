[package]
name = "daiza-app"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop client for Daiza inference engine"
license = "Apache-2.0"

[[bin]]
name = "daiza-app"
path = "src/main.rs"

[features]
app = []

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
daiza-web = { path = "../Daiza-web" }
daiza-runtime = { path = "../Daiza-runtime" }
daiza-engine = { path = "../Daiza-engine" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
