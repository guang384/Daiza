[build]
# 启用本机 CPU 的 SIMD 指令(AVX2/AVX-512),
# 让编译器能自动向量化 Q1_0 反量化 + FMA 点积循环。
# 学习项目,不考虑二进制可移植性。
rustflags = ["-C", "target-cpu=native"]

# 国内网络访问 crates.io 慢/失败时,可自行启用 rsproxy 镜像
# (默认注释: 不强制所有构建者经第三方镜像拉取依赖)
# [source.crates-io]
# replace-with = "rsproxy-sparse"
#
# [source.rsproxy-sparse]
# registry = "sparse+https://rsproxy.cn/index/"
