[build]
# 启用本机 CPU 的 SIMD 指令(AVX2/AVX-512),
# 让编译器能自动向量化 Q1_0 反量化 + FMA 点积循环。
# 学习项目,不考虑二进制可移植性。
rustflags = ["-C", "target-cpu=native"]

# 国内镜像源 (rsproxy 字节跳动, sparse 协议最快)
# 修复国内访问 crates.io 慢/失败的问题
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[source.rsproxy]
registry = "https://rsproxy.cn/crates.io-index"
