}

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }
let _scrollRaf = 0;
function scrollBottomThrottled() {
  if (_scrollRaf) return;
  _scrollRaf = requestAnimationFrame(() => { _scrollRaf = 0; chat.scrollTop = chat.scrollHeight; });
}

async function send() {
  const text = input.value.trim();
  // 允许仅有图片无文本发送 (但 bubble 仍需要非空 text 占位)
  if (busy) return;
  if (!text && pendingAttachments.length === 0) return;
  // 取出待发送附件 (send 后清空预览栏)
  const sendingAttachments = pendingAttachments.slice();
  pendingAttachments = [];
  renderAttachments();
  busy = true;
  setDsparkButtonsDisabled(true);  // 消息回复期间禁用 DSpark + think 开关
  // ★ 首次发送 (无 active session): 先调 ensure 立即创建 session 标签,
  //   让侧边栏在 prefill/推理开始前就显示, 不必等回答完成
  if (!activeSessionId) {
    try {
      await fetch(sessionsUrl('/api/sessions/ensure'), { method: 'POST' });
      await loadSessions();
    } catch (_) {}
  }
  // 重置全局 prefill 进度条 (上次发送可能残留)
  const _ppReset = document.getElementById('prefill-progress');
  if (_ppReset) {
    _ppReset.hidden = true;
    _ppReset.querySelector('.prefill-progress-fill').style.width = '0%';
  }
  sendBtn.title = 'Stop';
  iconSend.style.display = 'none';
  iconStop.style.display = '';
  input.value = '';
  input.style.height = '50px';
  // 用户气泡: 文本 + 图片缩略图 (如有)
  const userBubble = addMsg('user', text || '');
  if (sendingAttachments.length > 0) {
    const thumbRow = document.createElement('div');
    thumbRow.style.cssText = 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap';
    for (const att of sendingAttachments) {
      const t = document.createElement('div');
      t.style.cssText = 'width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.2)';
      const img = document.createElement('img');
      img.src = att.dataUrl;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover';
      t.appendChild(img);
      thumbRow.appendChild(t);
    }
    userBubble.appendChild(thumbRow);
  }

  const bubble = addMsg('bot', '');
  bubble.classList.add('thinking');
  // 三点跳动动效 (CSS 动画, 替代原 setInterval 文字点点)
  const dotsEl = document.createElement('span');
  dotsEl.className = 'thinking-dots';
  dotsEl.innerHTML = '<i></i><i></i><i></i>';
  bubble.appendChild(dotsEl);
  // thinkTimer 保留为 null (clearInterval(null) 安全, 各清理点无需修改)
  const thinkTimer = null;

  let first = true;
  let textSpan = null;
  let fullText = '';
  let failed = false;
  let aborted = false;
  // DSpark: committedLen = 已确认文本长度 (delta/accept/reject 后更新)
  // draft 时 fullText = committed + draft, renderStreamingText 解析整个 fullText
  // draft 部分用灰色标记 (最后一个未确认的 text-part)
  let committedLen = 0;
  let draftTextLen = 0;
  // tool_call: 收到的 tool_call 列表 (done 事件后渲染卡片)
  let pendingToolCalls = [];
  // tool_call: 是否有待处理的 tool_call (保持 busy 等待用户回传)
  let hasToolCall = false;
  // 推理指标 (done 事件携带)
  let ttftMs = null, msPerTok = null, nTok = 0;
  // 进度条: 仅使用全局 #prefill-progress (composer 上方), 不在 bubble 内创建局部进度条
  // ★ prefill/vision 阶段保留 thinking 指示 (状态词 + 跳动点), 让用户知道仍在工作
  //   thinking 状态由首个 delta/draft 事件清除 (真正开始输出文本时)
  let progressStarted = false;
  const ensureProgressUi = () => {
    if (progressStarted) return;
    progressStarted = true;
    // 不清除 thinking 状态, 保留 "Thinking..." + 跳动点显示
  };
  const onEvent = (kind, payload) => {
    if (kind === 'progress') {
      ensureProgressUi();
      const pp = document.getElementById('prefill-progress');
      if (!pp) return;
      const ppLabel = pp.querySelector('.prefill-progress-label');
      const ppFill = pp.querySelector('.prefill-progress-fill');
      pp.hidden = false;
      if (payload.stage === 'vision') {
        // vision 阶段 (图片处理): preprocess → ViT encode → project
        const idx = (payload.image_idx || 0) + 1;
        const tot = payload.total || 1;
        const phases = { preprocess: 'preprocess', encode: 'ViT encode', project: 'project' };
        const phLabel = phases[payload.phase] || payload.phase;
        if (ppLabel) ppLabel.textContent = `Vision · Image ${idx}/${tot} · ${phLabel}`;
        // vision 阶段进度: (idx-1)/tot + phase 权重 (每图 3 阶段)
        const phaseWeight = { preprocess: 0, encode: 0.6, project: 0.4 }[payload.phase] || 0;
        const pct = ((idx - 1) + phaseWeight) / tot * 100;
        if (ppFill) { ppFill.classList.add('vision'); ppFill.style.width = pct.toFixed(1) + '%'; }
      } else if (payload.stage === 'prefill') {
        // prefill 阶段 (token 前向传播填充 KV cache, vision 完成后执行)
        const done = payload.done || 0;
        const total = payload.total || 1;
        const pct = Math.min(100, done / total * 100);
        if (ppLabel) ppLabel.textContent = `Prefill ${done}/${total} tokens`;
        if (ppFill) { ppFill.classList.remove('vision'); ppFill.style.width = pct.toFixed(1) + '%'; }
      }
      scrollBottomThrottled();
    } else if (kind === 'loading') {
      // 首次请求时懒加载权重, 显示提示
      if (first) {
        clearInterval(thinkTimer);
        bubble.classList.remove('thinking');
        bubble.textContent = '';
        const loadEl = document.createElement('span');
        loadEl.className = 'loading-hint';
        loadEl.textContent = 'Loading model weights…';
        bubble.appendChild(loadEl);
      }
    } else if (kind === 'delta') {
      // 首个 delta: 隐藏全局 prefill 进度条 (prefill 结束, 进入 decode)
      const pp = document.getElementById('prefill-progress');
      if (pp) {
        pp.hidden = true;
        pp.querySelector('.prefill-progress-fill').style.width = '0%';
      }
      // 正常增量 (标准模式 / DSpark bonus / fallback)
      if (first) {
        clearInterval(thinkTimer);
        bubble.classList.remove('thinking');
        bubble.textContent = '';
        textSpan = document.createElement('span');
        const cur = document.createElement('span');
        cur.className = 'cursor';
        bubble.appendChild(textSpan);
        bubble.appendChild(cur);
        first = false;
      }
      // DSpark: delta 前 commit draft (灰色转黑), 避免混色
      // ★ delta 是已确认文本, 走 renderStreamingText 解析 think 块
      // ★ stripToolCallText: 过滤 <tool_call> 原始标签 (由卡片渲染, 不显示在文本气泡)
      draftTextLen = 0;
      fullText += payload.text || payload || '';
      committedLen = fullText.length;
      if (textSpan) renderStreamingText(stripToolCallText(fullText), textSpan);
      scrollBottomThrottled();
    } else if (kind === 'draft') {
      // DSpark 乐观显示: drafter 预测的文本, 灰色显示
      // 首个 draft 也表示 prefill 结束: 隐藏全局 prefill 进度条
      const pp = document.getElementById('prefill-progress');
      if (pp) {
        pp.hidden = true;
        pp.querySelector('.prefill-progress-fill').style.width = '0%';
      }
      if (first) {
        clearInterval(thinkTimer);
        bubble.classList.remove('thinking');
        bubble.textContent = '';
        textSpan = document.createElement('span');
        const cur = document.createElement('span');
        cur.className = 'cursor';
        bubble.appendChild(textSpan);
        bubble.appendChild(cur);
        first = false;
      }
      // 上一个 draft 未配对 (全 accept 后无 reject): fullText 已包含其文本, committedLen 同步
      if (committedLen < fullText.length) {
        committedLen = fullText.length;
      }
      const dt = payload.text || '';
      fullText += dt;
      draftTextLen = dt.length;
      // ★ draft 也走 renderStreamingText: 解析 think 块, 过滤 think 内容
      //   避免模型自发生成的 <think>...</think> 作为纯文本显示给用户
      // ★ stripToolCallText: 同 delta, 过滤 <tool_call> 原始标签
      if (textSpan) renderStreamingText(stripToolCallText(fullText), textSpan);
      scrollBottomThrottled();
    } else if (kind === 'accept') {
      // DSpark: draft 全部通过 verify, fullText 已包含 draft 文本, 标记为已确认
      draftTextLen = 0;
      committedLen = fullText.length;
      if (textSpan) renderStreamingText(stripToolCallText(fullText), textSpan);
    } else if (kind === 'reject') {
      // DSpark: 部分 reject, 截断 draft, 用 accepted 替换
      if (draftTextLen > 0) {
        fullText = fullText.slice(0, -draftTextLen);
        draftTextLen = 0;
      }
      const accepted = payload.accepted || '';
      fullText += accepted;
      committedLen = fullText.length;
      // ★ reject 后用 renderStreamingText 统一渲染 (解析 think 块)
      if (textSpan) renderStreamingText(stripToolCallText(fullText), textSpan);
      scrollBottomThrottled();
    } else if (kind === 'tool_call') {
      // tool_call 事件: 累积到 pendingToolCalls (done 事件后统一渲染卡片)
      const tc = payload.tool_call;
      if (tc && tc.name) pendingToolCalls.push(tc);
    } else if (kind === 'done') {
      if (typeof payload.ttft_ms === 'number') ttftMs = payload.ttft_ms;
      if (typeof payload.ms_per_tok === 'number') msPerTok = payload.ms_per_tok;
      if (typeof payload.n_tokens === 'number') nTok = payload.n_tokens;
      if (payload.stats) setStatus('ok', payload.stats);
      // 隐藏全局 prefill 进度条 (保险起见)
      const pp = document.getElementById('prefill-progress');
      if (pp) {
        pp.hidden = true;
        pp.querySelector('.prefill-progress-fill').style.width = '0%';
      }
      // 若 decode 生成 0 个 token (模型立即 EOS), 显示提示避免空 bubble
      if (first && nTok === 0 && pendingToolCalls.length === 0) {
        clearInterval(thinkTimer);
        bubble.classList.remove('thinking');
        bubble.textContent = '(no output)';
      }
      // ★ tool_call 处理: 标记 hasToolCall, 卡片在最终渲染后统一渲染
      //   (renderFinalText 会清空 bubble, 若在此处渲染卡片会被清掉)
      if (pendingToolCalls.length > 0) {
        hasToolCall = true;
        clearInterval(thinkTimer);
        bubble.classList.remove('thinking');
        // 移除 cursor
        const cur = bubble.querySelector('.cursor');
        if (cur) cur.remove();
        // pendingToolCalls 保留给最终渲染阶段使用
      }
    } else if (kind === 'aborted') {
      aborted = true;
      // 隐藏全局 prefill 进度条 (保险起见)
      const pp = document.getElementById('prefill-progress');
      if (pp) {
        pp.hidden = true;
        pp.querySelector('.prefill-progress-fill').style.width = '0%';
      }
    } else if (kind === 'error') {
      failErr = new Error((payload.text || payload) || 'unknown error');
      // 隐藏全局 prefill 进度条 (保险起见)
      const pp = document.getElementById('prefill-progress');
      if (pp) {
        pp.hidden = true;
        pp.querySelector('.prefill-progress-fill').style.width = '0%';
      }
    }
  };
  let failErr = null;
  abortController = IS_TAURI ? null : new AbortController();
  try {
    if (IS_TAURI) {
      // Tauri 模式: 事件经 Rust 侧 ureq 流式转发 (避开 WebView2 mixed-content 拦截)
      // Tauri 传原始 JSON data 字符串, 这里 parse 成对象 (与浏览器模式一致)
      const un = await listenChat('chat', e => {
        let p = {};
        try { p = JSON.parse(e.payload.data || '{}'); } catch (_) {}
        onEvent(e.payload.kind, p);
      });
      try {
        const imagePaths = sendingAttachments.map(a => a.path).filter(Boolean);
        await invokeChat('chat_send', { message: text || ' ', images: imagePaths });
      } finally {
        un();
      }
      if (failErr) throw failErr;
    } else {
      // 浏览器模式: fetch + ReadableStream 直读 SSE
      const imagePaths = sendingAttachments.map(a => a.path).filter(Boolean);
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text || ' ', images: imagePaths }),
        signal: abortController.signal
      });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const lines = raw.split('\n');
          let ev = 'message', data = '';
          for (const ln of lines) {
            if (ln.startsWith('event:')) ev = ln.slice(6).trim();
            else if (ln.startsWith('data:')) data += ln.slice(5).trim();
          }
          if (!data) continue;
          let payload;
          try { payload = JSON.parse(data); } catch (e) { continue; }
          if (ev === 'error') {
            onEvent('error', { text: payload.error || 'unknown error' });
            if (failErr) throw failErr;
          } else {
            onEvent(ev, payload);
          }
        }
      }
    }
  } catch (e) {
    if (aborted || e.name === 'AbortError') {
      aborted = true; // 浏览器 abort 触发 AbortError, Tauri 通过 aborted 事件标记
    } else {
      failed = true;
      clearInterval(thinkTimer);
      bubble.classList.remove('thinking');
      bubble.textContent = 'Error: ' + e.message;
    }
  }
  if (first) { clearInterval(thinkTimer); bubble.classList.remove('thinking'); }
  // 清理残留进度条 (异常路径下可能未移除)
  const leftoverProg = bubble.querySelector('.progress-wrap');
  if (leftoverProg) leftoverProg.remove();
  // 最终保险: 隐藏全局 prefill 进度条
  const _ppFinal = document.getElementById('prefill-progress');
  if (_ppFinal) {
    _ppFinal.hidden = true;
    _ppFinal.querySelector('.prefill-progress-fill').style.width = '0%';
  }
  const cur = bubble.querySelector('.cursor');
  if (cur) cur.remove();
  if (failed) {
    // 错误消息已在 catch 中写入
  } else if (aborted && first) {
    bubble.textContent = 'Stopped';
  } else if (fullText) {
    // ★ hasToolCall: 用 stripToolCallText 过滤原始 <tool_call> 标签 (由卡片渲染)
    const displayText = hasToolCall ? stripToolCallText(fullText) : fullText;
    if (displayText.trim()) {
      renderFinalText(displayText, bubble);
    } else {
      // 纯 tool_call (无其他文本): 清空 streaming 残留的 textSpan
      bubble.textContent = '';
    }
  }
  // ★ hasToolCall: 在 renderFinalText 后渲染卡片 (避免被清空)
  if (hasToolCall && pendingToolCalls.length > 0) {
    for (const tc of pendingToolCalls) {
      renderToolCallCard(bubble, tc);
    }
    pendingToolCalls = [];
  }
  // 追加推理指标 (TTFT + ms/tok), 仅在有数据且非错误/停止时显示
  if (!failed && ttftMs !== null) {
    const m = document.createElement('span');
    m.className = 'metrics';
    const parts = ['TTFT ' + ttftMs + 'ms'];
    if (msPerTok !== null) parts.push(msPerTok + 'ms/tok');
    if (nTok > 0) parts.push(nTok + ' tokens');
    m.textContent = parts.join(' · ');
    bubble.appendChild(m);
  }
  scrollBottom();
  // ★ tool_call: 有待处理 tool_call 时保持 busy (等待用户输入 tool_response)
  if (hasToolCall) {
    // 不结束 busy, 用户提交 tool_response 后由 sendToolResponse 结束
    input.focus();
    return;
  }
  busy = false;
  setDsparkButtonsDisabled(false);  // 恢复 DSpark + think 开关
  sendBtn.title = 'Send';
  iconSend.style.display = '';
  iconStop.style.display = 'none';
  abortController = null;
  input.focus();
}

sendBtn.addEventListener('click', () => { if (busy) abortCurrent(); else send(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!busy) send(); }
});
input.addEventListener('input', () => {
  input.style.height = '50px';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.focus();

// === Tool calling: 渲染 tool_call 卡片 + 处理 tool_response 回传 ===

/// 渲染 tool_call 卡片 (含输入框), 用户提交后调用 sendToolResponse
function renderToolCallCard(bubble, tc) {
  const block = document.createElement('div');
  block.className = 'tool-call-block';
  // header: 图标 + 标题 + 状态药丸
  const header = document.createElement('div');
  header.className = 'tool-call-header';
  header.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Function Call';
  const pill = document.createElement('span');
  pill.className = 'tc-status-pill';
  pill.textContent = 'Waiting';
  header.appendChild(pill);
  block.appendChild(header);

  // body
  const body = document.createElement('div');
  body.className = 'tool-call-body';
  // function name (带 ▶ 前缀)
  const nameEl = document.createElement('div');
  nameEl.className = 'tool-call-name';
  nameEl.textContent = tc.name + '()';
  body.appendChild(nameEl);
  // arguments label + 代码块
  const argsLabel = document.createElement('div');
  argsLabel.className = 'tool-call-args-label';
  argsLabel.textContent = 'Arguments';
  body.appendChild(argsLabel);
  const argsEl = document.createElement('div');
  argsEl.className = 'tool-call-args';
  if (Array.isArray(tc.arguments) && tc.arguments.length > 0) {
    for (const arg of tc.arguments) {
      const argEl = document.createElement('div');
      argEl.className = 'tool-call-arg';
      argEl.innerHTML = '<span class="tool-call-arg-key">' + escapeHtml(arg.name) + '</span>: <span class="tool-call-arg-val">' + escapeHtml(arg.value) + '</span>';
      argsEl.appendChild(argEl);
    }
  } else {
    const empty = document.createElement('div');
    empty.className = 'tool-call-arg-empty';
    empty.textContent = '(no arguments)';
    argsEl.appendChild(empty);
  }
  body.appendChild(argsEl);
  // status (带 spinner)
  const statusEl = document.createElement('div');
  statusEl.className = 'tool-call-status';
  statusEl.innerHTML = '<span class="tc-spinner"></span><span class="tc-status-text">Awaiting tool response…</span>';
  body.appendChild(statusEl);
  // response input + Submit button (人工执行后回传结果)
  const inputRow = document.createElement('div');
  inputRow.className = 'tool-response-input';
  const ta = document.createElement('textarea');
  ta.placeholder = 'Enter tool execution result… (Ctrl+Enter to submit)';
  const btn = document.createElement('button');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>Submit';
  const submit = () => {
    const content = ta.value.trim();
    if (!content) return;
    // 锁定输入 + 切换状态药丸
    ta.disabled = true;
    btn.disabled = true;
    inputRow.style.opacity = '0.5';
    pill.textContent = 'Submitted';
    pill.classList.add('sending');
    statusEl.classList.add('active');
    statusEl.querySelector('.tc-status-text').textContent = 'Processing response…';
    // 发送 tool_response, 回复追加到当前 bubble
    sendToolResponse(bubble, tc.name, content, statusEl, pill, () => {
      // tool_response 完成 (含链式 tool_call 已处理), 移除输入框
      inputRow.remove();
    });
  };
  btn.addEventListener('click', submit);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      submit();
    }
  });
  inputRow.appendChild(ta);
  inputRow.appendChild(btn);
  body.appendChild(inputRow);
  block.appendChild(body);
  bubble.appendChild(block);
  scrollBottom();
}

/// 简易 HTML 转义
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/// 从显示文本中移除 <tool_call>...</tool_call> 块
/// - 完整块: 移除整段 (tool_call 由卡片渲染, 不应在文本气泡里显示原始标签)
/// - 不完整块 (流式中 <tool_call> 已出现但 </tool_call> 未到): 移除从 <tool_call> 到末尾
///   避免流式过程中原始标签闪现给用户
function stripToolCallText(text) {
  let out = text;
  while (true) {
    const start = out.indexOf('<tool_call>');
    if (start === -1) break;
    const end = out.indexOf('</tool_call>', start);
    if (end === -1) {
      // 流式中不完整的 tool_call 块: 移除从 <tool_call> 到末尾
      out = out.slice(0, start);
      break;
    }
    out = out.slice(0, start) + out.slice(end + '</tool_call>'.length);
  }
  return out;
}

/// 发送 tool_response, 流式接收回复并追加到 bubble
/// 回复中若再次包含 tool_call (链式调用), 渲染卡片并保持 busy
async function sendToolResponse(bubble, toolName, toolContent, statusEl, pill, onComplete) {
  const setStatus = (text, state) => {
    if (statusEl) {
      statusEl.classList.remove('active', 'done');
      if (state) statusEl.classList.add(state);
      const t = statusEl.querySelector('.tc-status-text');
      if (t) t.textContent = text;
    }
    if (pill) {
      pill.classList.remove('sending', 'done');
      if (state === 'active') pill.classList.add('sending');
      if (state === 'done') pill.classList.add('done');
      if (state === 'done') pill.textContent = 'Done';
      else if (state === 'active') pill.textContent = 'Running';
    }
  };
  setStatus('Executing tool…', 'active');
  let fullText = '';
  let textSpan = null;
  let first = true;
  let pendingToolCalls = [];
  let hasToolCall = false;

  const onEvent = (kind, payload) => {
    if (kind === 'delta') {
      if (first) {
        first = false;
        // 在 bubble 末尾追加新的 textSpan (tool_response 的回复)
        const sep = document.createElement('div');
        sep.className = 'tool-response-sep';
        sep.style.cssText = 'border-top:1px solid var(--border);margin-top:8px;padding-top:8px';
        bubble.appendChild(sep);
        textSpan = document.createElement('span');
        const cur = document.createElement('span');
        cur.className = 'cursor';
        bubble.appendChild(textSpan);
        bubble.appendChild(cur);
        setStatus('Response received', 'done');
      }
      fullText += payload.text || payload || '';
      // ★ stripToolCallText: 过滤 <tool_call> 原始标签 (由卡片渲染)
      if (textSpan) renderStreamingText(stripToolCallText(fullText), textSpan);
      scrollBottomThrottled();
    } else if (kind === 'tool_call') {
      const tc = payload.tool_call;
      if (tc && tc.name) pendingToolCalls.push(tc);
    } else if (kind === 'done') {
      // ★ 标记 hasToolCall, 卡片在最终渲染后统一渲染 (避免被清空)
      if (pendingToolCalls.length > 0) {
        hasToolCall = true;
        const cur = bubble.querySelector('.cursor:last-child');
        if (cur) cur.remove();
        // pendingToolCalls 保留给最终渲染阶段使用
      }
    }
  };

  try {
    if (IS_TAURI) {
      // Tauri 模式暂不支持 tool_response (走浏览器模式)
      throw new Error('tool_response not supported in Tauri mode');
    } else {
      const resp = await fetch('/api/chat/tool_response', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: toolName, content: toolContent })
      });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const lines = raw.split('\n');
          let ev = 'message', data = '';
          for (const ln of lines) {
            if (ln.startsWith('event:')) ev = ln.slice(6).trim();
            else if (ln.startsWith('data:')) data += ln.slice(5).trim();
          }
          if (!data) continue;
          let payload;
          try { payload = JSON.parse(data); } catch (e) { continue; }
          if (ev === 'error') {
            onEvent('error', { text: payload.error || 'unknown error' });
          } else {
            onEvent(ev, payload);
          }
        }
      }
    }
  } catch (e) {
    const errEl = document.createElement('div');
    errEl.style.cssText = 'color:var(--accent3);font-size:12px;margin-top:6px';
    errEl.textContent = 'Error: ' + e.message;
    bubble.appendChild(errEl);
  }

  // 最终渲染
  if (!first && fullText) {
    const cur = bubble.querySelector('.cursor:last-child');
    if (cur) cur.remove();
    // ★ hasToolCall: 用 stripToolCallText 过滤原始 <tool_call> 标签, 重新渲染 textSpan
    if (hasToolCall && textSpan) {
      const displayText = stripToolCallText(fullText);
      if (displayText.trim()) {
        renderStreamingText(displayText, textSpan);
      } else {
        // 纯 tool_call (无其他文本): 移除 textSpan 和之前的分隔线
        textSpan.remove();
        const sep = bubble.querySelector('.tool-response-sep');
        if (sep) sep.remove();
      }
    }
    // 非 hasToolCall: 保持 renderStreamingText 的结果即可
  }

  // ★ hasToolCall: 渲染链式 tool_call 卡片 (在 textSpan 重新渲染后)
  if (hasToolCall && pendingToolCalls.length > 0) {
    for (const tc of pendingToolCalls) {
      renderToolCallCard(bubble, tc);
    }
    pendingToolCalls = [];
  }

  if (!hasToolCall) {
    // 无链式 tool_call: 结束 busy, 恢复 UI
    busy = false;
    setDsparkButtonsDisabled(false);
    sendBtn.title = 'Send';
    iconSend.style.display = '';
    iconStop.style.display = 'none';
    abortController = null;
    if (typeof onComplete === 'function') onComplete();
    input.focus();
  } else {
    if (typeof onComplete === 'function') onComplete();
  }
  scrollBottom();
}

/// 打开工具编辑器 (新增或编辑)

  editingToolName = existing ? existing.name : null;

      addParamRow(p.name, p.description, p.param_type, p.required);

/// 添加参数行
function addParamRow(name, desc, type, required) {
  const row = document.createElement('div');
  row.className = 'tool-param-row';
  const nameInput = document.createElement('input');
  nameInput.className = 'tool-input param-name';
  nameInput.placeholder = 'param name';
  nameInput.value = name || '';
  const typeInput = document.createElement('input');
  typeInput.className = 'tool-input param-type';
  typeInput.placeholder = 'type';
  typeInput.value = type || 'string';
  const reqInput = document.createElement('input');
  reqInput.type = 'checkbox';
  reqInput.className = 'param-required';
  reqInput.title = 'Required';
  reqInput.checked = !!required;
  const delBtn = document.createElement('button');
  delBtn.className = 'param-del';
  delBtn.type = 'button';
  delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  delBtn.addEventListener('click', () => row.remove());
  row.appendChild(nameInput);
  row.appendChild(typeInput);
  row.appendChild(reqInput);
  row.appendChild(delBtn);
  toolParamsContainer.appendChild(row);
}

/// 保存工具 (新增或更新)
async function saveTool() {
  const name = toolNameInput.value.trim();
  if (!name) { toolNameInput.focus(); return; }
  const description = toolDescInput.value.trim();
  const parameters = [];
  const rows = toolParamsContainer.querySelectorAll('.tool-param-row');
  rows.forEach(row => {
    const pName = row.querySelector('.param-name').value.trim();
    if (!pName) return;
    const pType = row.querySelector('.param-type').value.trim() || 'string';
    const pReq = row.querySelector('.param-required').checked;
    parameters.push({ name: pName, description: '', param_type: pType, required: pReq });
  });
  try {
    const r = await fetch(IS_TAURI ? 'http://127.0.0.1:8787/api/tools' : '/api/tools', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description, parameters })
    });
    if (r.ok) {
      toolEditor.hidden = true;
      loadTools();
    } else {
      const j = await r.json().catch(() => ({}));
      alert('Save failed: ' + (j.error || r.status));
    }
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

/// 删除工具
async function deleteTool(name) {
  if (!confirm('Delete tool "' + name + '"?')) return;
  try {
    const r = await fetch(IS_TAURI ? 'http://127.0.0.1:8787/api/tools/delete' : '/api/tools/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    if (r.ok) loadTools();
  } catch (e) { /* silent */ }
}

// 工具箱图标点击: 展开/收起工具面板
toolsToggle.addEventListener('click', () => {
  toolsPanel.hidden = !toolsPanel.hidden;
  if (!toolsPanel.hidden && !toolsLoaded) loadTools();
});
toolAddBtn.addEventListener('click', () => openToolEditor(null));
toolParamAddBtn.addEventListener('click', () => addParamRow('', '', 'string', false));
toolSaveBtn.addEventListener('click', saveTool);
toolCancelBtn.addEventListener('click', () => { toolEditor.hidden = true; });
</script>
