<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daiza Chat</title>
<style>
  :root {
    --bg: #07070f;
    --panel: rgba(255,255,255,.045);
    --border: rgba(255,255,255,.09);
    --text: #e8e8f2;
    --dim: #9a9ab0;
    --accent1: #7c5cff;
    --accent2: #00e0c6;
    --accent3: #ff5c8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .aurora {
    position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    filter: blur(90px); opacity: .5;
  }
  .aurora div { position: absolute; border-radius: 50%; }
  .a1 { width: 45vw; height: 45vw; left: -8%; top: -10%;
        background: radial-gradient(circle, var(--accent1), transparent 65%);
        animation: drift1 26s ease-in-out infinite alternate; }
  .a2 { width: 40vw; height: 40vw; right: -10%; top: 15%;
        background: radial-gradient(circle, var(--accent2), transparent 65%);
        animation: drift2 32s ease-in-out infinite alternate; }
  .a3 { width: 38vw; height: 38vw; left: 25%; bottom: -18%;
        background: radial-gradient(circle, var(--accent3), transparent 65%);
        animation: drift3 24s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(9vw, 6vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-7vw, 9vh) scale(0.9); } }
  @keyframes drift3 { to { transform: translate(6vw, -8vh) scale(1.1); } }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; max-width: 860px; margin: 0 auto;
    padding: 20px 18px 14px;
  }
  header { text-align: center; padding: 8px 0 18px; flex: 0 0 auto; }
  .logo {
    font-size: 34px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sheen 6s linear infinite;
  }
  @keyframes sheen { to { background-position: 300% 0; } }
  #status {
    margin-top: 6px; font-size: 12.5px; color: var(--dim);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #888;
         box-shadow: 0 0 8px currentColor; }
  .dot.ok   { background: var(--accent2); color: var(--accent2); }
  .dot.warn { background: #ffb454; color: #ffb454; animation: pulse 1.2s ease-in-out infinite; }
  .dot.err  { background: var(--accent3); color: var(--accent3); }
  @keyframes pulse { 50% { opacity: .35; } }

  #chat {
    flex: 1 1 auto; overflow-y: auto; padding: 18px 14px;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

  .msg { display: flex; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 12px 16px; border-radius: 18px;
    font-size: 14.5px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    color: #fff;
    background: linear-gradient(135deg, #6a4dff, #8f5cff);
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 22px rgba(124,92,255,.35);
  }
  .msg.bot .bubble {
    color: var(--text);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .avatar {
    flex: 0 0 auto; width: 34px; height: 34px; margin: 2px 10px 0 0;
    border-radius: 12px; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; color: #04110f;
    background: linear-gradient(135deg, var(--accent2), #5cf0ff);
    box-shadow: 0 4px 16px rgba(0,224,198,.4);
  }
  .bubble.thinking { color: var(--dim); font-style: italic; }
  .bubble .cursor {
    display: inline-block; width: 8px; height: 1.1em; margin-left: 2px;
    vertical-align: text-bottom; border-radius: 2px;
    background: var(--accent2);
    animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #composer { flex: 0 0 auto; display: flex; gap: 10px; margin-top: 14px; }
  #input {
    flex: 1; resize: none; height: 50px; max-height: 160px;
    padding: 14px 18px; font: inherit; font-size: 14.5px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    outline: none; transition: border-color .2s, box-shadow .2s;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #input:focus {
    border-color: rgba(124,92,255,.6);
    box-shadow: 0 0 0 3px rgba(124,92,255,.18);
  }
  #send {
    width: 52px; height: 50px; border: none; border-radius: 16px; cursor: pointer;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent3));
    box-shadow: 0 6px 20px rgba(255,92,138,.3);
    transition: transform .15s, filter .15s;
  }
  #send:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
  #send:active:not(:disabled) { transform: translateY(0); }
  #send:disabled { filter: grayscale(.7); opacity: .5; cursor: not-allowed; }
  #send svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="aurora"><div class="a1"></div><div class="a2"></div><div class="a3"></div></div>
  <div id="app">
    <header>
      <div class="logo">DAIZA</div>
      <div id="status"><span class="dot warn" id="dot"></span><span id="statusText">连接中…</span></div>
    </header>
    <div id="chat"></div>
    <div id="composer">
      <textarea id="input" placeholder="输入消息,Enter 发送 (Shift+Enter 换行)"></textarea>
      <button id="send" title="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6l17.4-7.5c.8-.35.8-1.45 0-1.8L3.4 3.8c-.66-.29-1.4.2-1.4.9v4.6c0 .5.36.93.86 1.02L16.8 12 2.86 13.68c-.5.09-.86.52-.86 1.02v4.6c0 .7.74 1.19 1.4.9z"/></svg>
      </button>
    </div>
  </div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
let busy = false;

const IS_TAURI = !!window.__TAURI__;
let invokeChat = null, listenChat = null;
if (IS_TAURI) {
  invokeChat = window.__TAURI__.core.invoke;
  listenChat = window.__TAURI__.event.listen;
}

function setStatus(cls, text) {
  dot.className = 'dot ' + cls;
  statusText.textContent = text;
}

async function pollStatus() {
  try {
    const r = await fetch(IS_TAURI ? 'http://127.0.0.1:8787/api/status' : '/api/status');
    const j = await r.json();
    if (j.ready) {
      setStatus('ok', j.model + ' 已就绪');
    } else {
      setStatus('warn', '模型加载中… (~13GB, 请稍候)');
      setTimeout(pollStatus, 2000);
    }
  } catch (e) {
    setStatus('err', '服务器连接失败');
    setTimeout(pollStatus, 3000);
  }
}
pollStatus();

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (role === 'bot') {
    const av = document.createElement('div');
    av.className = 'avatar'; av.textContent = 'D';
    wrap.appendChild(av);
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = '50px';
  addMsg('user', text);

  const bubble = addMsg('bot', '');
  bubble.classList.add('thinking');
  bubble.textContent = '思考中';
  let dots = 0;
  const thinkTimer = setInterval(() => {
    dots = (dots + 1) % 4;
    if (bubble.classList.contains('thinking')) bubble.textContent = '思考中' + '.'.repeat(dots);
  }, 400);

  let first = true;
  const onEvent = (kind, text) => {
    if (kind === 'delta') {
      if (first) {
        clearInterval(thinkTimer);
        bubble.classList.remove('thinking');
        bubble.textContent = '';
        const cur = document.createElement('span');
        cur.className = 'cursor';
        bubble.appendChild(cur);
        first = false;
      }
      bubble.firstChild
        ? bubble.insertBefore(document.createTextNode(text), bubble.lastChild)
        : bubble.textContent += text;
      scrollBottom();
    } else if (kind === 'done') {
      if (text) setStatus('ok', text);
    } else if (kind === 'error') {
      failErr = new Error(text || 'unknown error');
    }
  };
  let failErr = null;
  try {
    if (IS_TAURI) {
      // Tauri 模式: 事件经 Rust 侧 ureq 流式转发 (避开 WebView2 mixed-content 拦截)
      const un = await listenChat('chat', e => onEvent(e.payload.kind, e.payload.text));
      try {
        await invokeChat('chat_send', { message: text });
      } finally {
        un();
      }
      if (failErr) throw failErr;
    } else {
      // 浏览器模式: fetch + ReadableStream 直读 SSE
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const lines = raw.split('\n');
          let ev = 'message', data = '';
          for (const ln of lines) {
            if (ln.startsWith('event:')) ev = ln.slice(6).trim();
            else if (ln.startsWith('data:')) data += ln.slice(5).trim();
          }
          if (!data) continue;
          let payload;
          try { payload = JSON.parse(data); } catch (e) { continue; }
          if (ev === 'error') {
            onEvent('error', payload.error || 'unknown error');
            if (failErr) throw failErr;
          } else {
            onEvent(ev, payload.text || payload.stats || '');
          }
        }
      }
    }
  } catch (e) {
    clearInterval(thinkTimer);
    bubble.classList.remove('thinking');
    bubble.textContent = '出错了: ' + e.message;
  }
  if (first) { clearInterval(thinkTimer); bubble.classList.remove('thinking'); }
  const cur = bubble.querySelector('.cursor');
  if (cur) cur.remove();
  scrollBottom();
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = '50px';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.focus();
</script>
</body>
</html>
